<nav class="workflow-stepper" aria-label="Avanzamento creazione formula">
  @for (step of steps; track step.id; let index = $index) {
    <button
      type="button"
      class="workflow-step"
      [class.active]="step.id === activeStep"
      [class.completed]="step.id < activeStep"
      [class.locked]="step.id > maxAvailableStep"
      [disabled]="step.id > maxAvailableStep"
      [attr.aria-current]="step.id === activeStep ? 'step' : null"
      [attr.aria-label]="'Passaggio ' + step.id + ': ' + step.label"
      (click)="selectStep(step.id)"
    >
      <span class="workflow-step-index">
        @if (step.id < activeStep) {
          <span aria-hidden="true">✓</span>
        } @else {
          {{ step.id }}
        }
      </span>

      <span class="workflow-step-copy">
        <strong>{{ step.label }}</strong>
        @if (step.description) {
          <small>{{ step.description }}</small>
        }
      </span>
    </button>

    @if (index < steps.length - 1) {
      <span
        class="workflow-connector"
        [class.completed]="step.id < activeStep"
        aria-hidden="true"
      ></span>
    }
  }
</nav>
