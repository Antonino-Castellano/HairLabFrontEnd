<div class="subscription-container">
  <div class="subscription-content-wrapper">
    
    <header class="header-section">
      <h1>PIANI DI ABBONAMENTO HAIRLAB</h1>
      <p class="description">SCEGLI IL PIANO PERFETTO PER TE E SCOPRI TUTTI I VANTAGGI DI HAIRLAB.</p>
    </header>

    <div class="superadmin-section">
      <p class="superadmin-text">Hai già un'account SuperAdmin?</p>
      <button type="button" class="login-button" (click)="onLogin()">Accedi</button>
    </div>

    <div class="plans-grid top-grid">
      <div class="plan-card" *ngFor="let plan of topPlans">
        <h3 class="plan-title">{{ plan.title }}</h3>
        <div class="plan-price">{{ plan.price }}</div>
        
        <ul class="plan-features">
          <li *ngFor="let feature of plan.features">
            <span class="bullet"></span> {{ feature }}
          </li>
        </ul>

        <button type="button" class="plan-button" (click)="onSelectPlan(plan)">
          {{ plan.buttonText }}
        </button>
      </div>
    </div>

    <div class="plans-grid bottom-grid">
      <div class="plan-card" *ngFor="let plan of bottomPlans">
        <h3 class="plan-title">{{ plan.title }}</h3>
        <div class="plan-price">{{ plan.price }}</div>
        
        <ul class="plan-features">
          <li *ngFor="let feature of plan.features">
            <span class="bullet"></span> {{ feature }}
          </li>
        </ul>

        <button type="button" class="plan-button" (click)="onSelectPlan(plan)">
          {{ plan.buttonText }}
        </button>
      </div>
    </div>

  </div>
</div>
