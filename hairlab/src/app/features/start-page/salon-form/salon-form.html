<div class="register-page-container">
<div class="register-content-wrapper">
<div class="register-container">
 <h2>REGISTRAZIONE SALONE - HAIRLAB</h2>
 
 <div class="plan-summary">
 <p>Piano scelto: <strong>{{ selectedPlan }}</strong></p>
 <p>Prezzo: <strong>€ {{ selectedPrice }}</strong></p>
</div>

<div *ngIf="errorMessage" class="error-alert">
  {{ errorMessage }}
</div>

 <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
 
 <div class="form-group">
 <label>Nome</label>
 <input type="text" formControlName="firstName" placeholder="Inserisci il nome">
 </div>

 <div class="form-group">
 <label>Cognome</label>
 <input type="text" formControlName="lastName" placeholder="Inserisci il cognome">
 </div>

 <div class="form-group">
 <label>Numero di Telefono</label>
 <input type="text" formControlName="phoneNumber" placeholder="Inserisci il telefono">
 </div>
 <div class="form-group">
<label>Email</label>
<input type="email" formControlName="email" placeholder="Inserisci l'email">
 </div>

 <div class="form-group">
<label>Password</label>
<input type="password" formControlName="password" placeholder="Inserisci la password">
 </div>

 <div class="form-group">
 <label>Metodo di Pagamento</label>
  <select formControlName="paymentType">
 <option value="" disabled>Seleziona metodo</option>
 <option *ngFor="let type of paymentTypes" [value]="type">
 {{ type === 'PAYPAL' ? 'PayPal' : 'Carta di Credito' }}
 </option>
  </select>
 </div>

<button type="submit" class="submit-btn">COMPLETA REGISTRAZIONE</button>
</form>
</div>
 </div>
</div>
